schema_version: 1
stage: locked_test_confirmation
selection_lock: configs/latent_factor_beyond_rmse/selection_lock.yaml
output_root: outputs/latent_factor_beyond_rmse/confirmation

test_protocol:
  train_on: selected_controlled_sparsity_training_artifact_only
  validation_use: exclude_from_test_candidates_only
  test_access: only_after_selection_lock_verification
  prediction_rows: all_test_ratings
  ranking_catalog: exact_train_known_catalog
  user_history_exclusions:
    - full_training_history_including_rows_removed_for_sparsity
    - validation_history
  naturally_item_cold_events: separate_from_primary_ranking

inference:
  user_cluster_bootstrap_resamples: 10000
  paired_randomization_resamples: 10000
  seed: 424242
  confidence_level: 0.95
  multiplicity_adjustment: holm_across_12_primary_conditions
