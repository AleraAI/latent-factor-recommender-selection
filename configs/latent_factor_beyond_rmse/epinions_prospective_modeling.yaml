stage: prospective_development_validation_only
test_access: prohibited_until_epinions_selection_lock

development_output_root: outputs/latent_factor_beyond_rmse/prospective_epinions/development

explicit_mf:
  dimensions: [1, 2, 4, 8, 16, 32, 64]
  regularizations: [0.0, 0.0001, 0.001, 0.01, 0.1]
  selection_seeds: [101, 211, 307, 401, 503]
  confirmation_seeds: [601, 701, 809, 907, 1009]
  learning_rate: 0.01
  batch_size: 4096
  max_epochs: 20
  smoke_epochs: 3
  convergence_patience: 5
  convergence_relative_tolerance: 0.00001
  ranking_batch_size: 256
  device: cpu
  torch_num_threads: 1
  objective: >-
    Mean per-observation squared error plus lambda times the mean sum of
    squared user bias, item bias, user factors, and item factors for each
    observed training pair. The global mean is not regularized.

comparators:
  prediction_metric: validation.prediction.clipped.rmse
  ranking_metric: validation.ranking.ndcg@10
  aggregation: mean_across_selection_seeds

uncertainty_aware_selection:
  reference: highest_mean_validation_ndcg_at_10
  regret_pairing: common_random_seed
  confidence_bound: one_sided_student_t_upper
  confidence_level: 0.95
  practical_ndcg_at_10_regret: 0.005
  admissibility_rule: paired_regret_upper_bound_lte_threshold
  optimize_within_admissible_set: lowest_mean_validation_rmse
  tie_breakers:
    - lower_mean_training_seconds
    - smaller_dimension
    - larger_regularization
  interpretation: >-
    The bound is an operational uncertainty screen used by a prospectively
    evaluated selection algorithm, not a simultaneous post-selection
    confidence statement over the complete configuration family.

ranking:
  relevance_threshold: 4.0
  graded_gains:
    "4": 1.0
    "5": 3.0
  cutoffs: [10, 20]
  candidates: exact_train_known_catalog_minus_user_history
  score_tie_break: ascending_item_id

