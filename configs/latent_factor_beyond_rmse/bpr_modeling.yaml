schema_version: 1
stage: bpr_development_validation_only
test_access: prohibited_until_bpr_selection_lock

development_output_root: outputs/latent_factor_beyond_rmse/bpr_development
confirmation_output_root: outputs/latent_factor_beyond_rmse/bpr_confirmation

bpr_mf:
  dimensions: [1, 2, 4, 8, 16, 32, 64]
  regularizations: [0.0, 0.0001, 0.001, 0.01, 0.1]
  selection_seeds: [101, 211, 307, 401, 503]
  confirmation_seeds: [601, 701, 809, 907, 1009]
  learning_rate: 0.01
  batch_size: 4096
  max_epochs: 20
  smoke_epochs: 2
  negatives_per_positive: 1
  relevance_threshold: 4.0
  ranking_batch_size: 256
  device: cpu
  torch_num_threads: 1
  objective: >-
    Mean softplus of negative score minus positive score plus lambda times
    the mean summed squared user-factor, positive-item-factor,
    negative-item-factor, positive-item-bias, and negative-item-bias terms.
    One unobserved catalog item is sampled independently per retained
    positive interaction in every epoch.
  positive_definition: retained_training_rating_at_least_4
  negative_sampling: >-
    Uniform over items in the controlled-sparsity training catalog that the
    user has not rated in that same retained training artifact. Removed
    full-training interactions, validation, and test are not inspected by the
    sampler.

selection:
  metric: validation.ranking.ndcg@10
  rule: mean_across_selection_seeds
  tie_breakers:
    - smaller_dimension
    - larger_regularization

ranking:
  relevance_threshold: 4.0
  graded_gains:
    "4": 1.0
    "5": 3.0
  cutoffs: [10, 20]
  candidates: exact_train_known_catalog_minus_user_history
  score_tie_break: ascending_item_id
